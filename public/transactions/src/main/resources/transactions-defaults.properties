com.atomikos.icatch.enable_logging=true
com.atomikos.icatch.force_shutdown_on_vm_exit=false
com.atomikos.icatch.checkpoint_interval=500
com.atomikos.icatch.serial_jta_transactions=true
com.atomikos.icatch.default_jta_timeout=10000
com.atomikos.icatch.max_timeout=300000
com.atomikos.icatch.log_base_dir=./
com.atomikos.icatch.max_actives=50
com.atomikos.icatch.log_base_name=tmlog
com.atomikos.icatch.forget_orphaned_log_entries_delay=86400000
com.atomikos.icatch.recovery_delay=${com.atomikos.icatch.default_jta_timeout}
com.atomikos.icatch.oltp_max_retries=5
com.atomikos.icatch.oltp_retry_interval=10000
com.atomikos.icatch.allow_subtransactions=true
com.atomikos.icatch.logcloud_datasource_name=logCloudDS
com.atomikos.icatch.throw_on_heuristic=false
com.atomikos.icatch.log_lock_acquisition_max_attempts=3
com.atomikos.icatch.log_lock_acquisition_retry_delay=1000

# ==========================================================================
# Opt-in feature flags (com.atomikos.icatch.feature.<id>). See
# com.atomikos.icatch.provider.ConfigProperties's FEATURE_<id> constants
# for a code-reference to the ids below.
# ==========================================================================
# Experimental: selects a redesigned transaction service/manager implementation. Not yet recommended for production use -- validation is still in progress.
com.atomikos.icatch.feature.207056=true
# Oracle AQ forceConnectionIntoXaMode workaround (cf case 226870) — ADR-003: behavioral-change flag.
# true = keep the legacy workaround (old behaviour, safe for pre-19c Oracle AQ); false = skip it
# (new behaviour, validated against Oracle AQ 19c). ADR-003: stable keeps the old/safe default (true)
# until the new behaviour is broadly proven; dev runs the new default (false) so CI validates it.
com.atomikos.icatch.feature.226870=false
# Doomed-enlistment guard (cf case 227307) — refuses enlisting a resource on a transaction that has already timed out or been marked rollback-only, before the XA branch starts, so a doomed transaction fails immediately at its next use instead of only at commit
com.atomikos.icatch.feature.227307=true
# REQUIRES_NEW timeout inheritance (cf case 230271) — caps a REQUIRES_NEW transaction's timeout to the remaining time of the transaction it suspends, so a compound business operation's overall deadline is respected across the sub-step; disabled by default, so with nothing configured a REQUIRES_NEW transaction keeps its own full default timeout.
# ADR-003: disabled-in-all-repos — intentionally off in every repository type, including development, because enabling it by default would alter the timeout budget of existing REQUIRES_NEW transactions across the suite. CI validates the new behaviour by opting in explicitly (RequiresNewTimeoutInheritanceTestJUnit sets the flag), not via the default, so dev=false is correct.
com.atomikos.icatch.feature.230271=false
